<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Control Panel | Gondal Electronics</title>
<style>
:root{--bg-dark:#06050a;--card-bg:#120f1e;--accent-purple:#7000ff;--accent-glow:#a855f7;--text-white:#f8fafc;--text-dim:#94a3b8;--border:rgba(112,0,255,.25)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg-dark);color:var(--text-white)}
#authModal{position:fixed;inset:0;background:#040307;z-index:9999;display:grid;place-items:center;padding:20px}
.auth-card{background:var(--card-bg);border:1px solid var(--border);border-radius:28px;padding:45px;width:min(440px,100%);text-align:center;box-shadow:0 0 60px rgba(112,0,255,.25)}
.auth-card input{width:100%;padding:16px;margin:24px 0 16px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:#fff;text-align:center;font-size:16px;outline:none}
.auth-card button{width:100%;padding:16px;border-radius:12px;border:0;background:linear-gradient(135deg,var(--accent-purple),var(--accent-glow));color:#fff;font-weight:800;cursor:pointer;font-size:16px}
.app-grid{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
aside{background:#0c0a14;border-right:1px solid var(--border);padding:35px 22px}
main{padding:45px}
.nav-btn{width:100%;text-align:left;background:rgba(255,255,255,.04);border:1px solid var(--border);color:#fff;padding:14px 20px;border-radius:14px;margin-bottom:14px;cursor:pointer;font-weight:600;transition:.3s}
.nav-btn:hover,.nav-btn.active{background:var(--accent-purple);border-color:var(--accent-glow)}
.panel{background:var(--card-bg);border:1px solid var(--border);border-radius:24px;padding:32px;margin-bottom:28px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}
.form-grid input,.form-grid select,.form-grid textarea{width:100%;padding:14px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:#fff;font-size:14px;outline:none}
.form-grid select option{background:#120f1e;color:#fff}
table{width:100%;border-collapse:collapse;margin-top:20px}th,td{text-align:left;padding:16px;border-bottom:1px solid var(--border);font-size:14px}th{color:var(--text-dim);font-size:12px;text-transform:uppercase;letter-spacing:1px}
.btn-action{background:linear-gradient(135deg,var(--accent-purple),var(--accent-glow));color:#fff;border:0;padding:14px 24px;border-radius:12px;font-weight:700;cursor:pointer}
.btn-del{background:#ef4444;color:#fff;border:0;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600}
@media(max-width:850px){.app-grid{grid-template-columns:1fr}aside{position:relative;padding:20px}main{padding:25px 18px}.form-grid{grid-template-columns:1fr}table{display:block;overflow-x:auto;white-space:nowrap}.nav-btn{display:inline-block;width:auto;margin-right:8px}.auth-card{padding:30px}}
</style>
</head>
<body>

<div id="authModal">
<div class="auth-card">
<h2 style="font-size:26px">Gondal Admin Access</h2>
<p style="color:var(--text-dim);font-size:14px;margin-top:6px">Protected Store & CMS Control</p>
<input type="password" id="passCode" placeholder="Enter Admin Password" autocomplete="current-password">
<button onclick="unlockPortal()">Unlock Dashboard</button>
</div>
</div>

<div class="app-grid">
<aside>
<h2 style="font-size:20px;margin-bottom:30px;color:var(--accent-glow)">ADMIN DASHBOARD</h2>
<button class="nav-btn active" onclick="showTab('tabStore',this)">📦 Store Inventory</button>
<button class="nav-btn" onclick="showTab('tabCms',this)">🌐 Website Text & Deals</button>
</aside>

<main>
<div id="tabStore">
<h2 style="margin-bottom:24px">Manage Products, Prices & WhatsApp Specs</h2>
<div class="panel">
<h3 style="font-size:18px">Add New Appliance to Store</h3>
<div class="form-grid">
<input id="pName" placeholder="Product Name (e.g. 55 Inch OLED TV)">
<select id="pCat">
<option>Inverter AC</option><option>Refrigerators</option><option>Smart TVs</option><option>Washing Machines</option><option>Kitchen</option>
</select>
<input id="pPrice" type="number" placeholder="Sale Price (Rs.)">
<input id="pOldPrice" type="number" placeholder="Original Price (Rs.)">
<input id="pDiscount" placeholder="Discount Tag (e.g. 15% OFF)">
<input id="pIcon" placeholder="Emoji Icon (e.g. 📺)">
<textarea id="pDesc" style="grid-column:1/-1" placeholder="Product Specifications & Build Details"></textarea>
<button class="btn-action" style="grid-column:1/-1" onclick="addProduct()">Publish Product to Online Store</button>
</div>
</div>

<div class="panel">
<h3 style="font-size:18px">Active Store Inventory</h3>
<table>
<thead><tr><th>Product Name</th><th>Category</th><th>Price</th><th>Discount</th><th>Action</th></tr></thead>
<tbody id="inventoryTable"></tbody>
</table>
</div>
</div>

<div id="tabCms" style="display:none">
<h2 style="margin-bottom:24px">Update Website Text & Floating Deals</h2>
<div class="panel">
<h3 style="font-size:18px">Main Homepage Hero & Floating Offer</h3>
<div class="form-grid">
<input id="cmsTitle" placeholder="Main Hero Title Headline" style="grid-column:1/-1">
<textarea id="cmsDesc" placeholder="Hero Subtitle Description" style="grid-column:1/-1" rows="3"></textarea>
<input id="cmsDeal" placeholder="Floating Live Deal Text" style="grid-column:1/-1">
<button class="btn-action" style="grid-column:1/-1" onclick="saveCms()">Save & Apply Changes to Website</button>
</div>
</div>
</div>
</main>
</div>

<script>
function unlockPortal(){
if(document.getElementById("passCode").value==="Shahram123"){
document.getElementById("authModal").style.display="none";
sessionStorage.setItem("gondalAuth","true");
}else alert("Incorrect Security Password!");
}
if(sessionStorage.getItem("gondalAuth")==="true")document.getElementById("authModal").style.display="none";

let products=JSON.parse(localStorage.getItem("gondalProducts"))||[];

function escapeHtml(value){
return String(value??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function renderTable(){
document.getElementById("inventoryTable").innerHTML=products.length?products.map((p,index)=>`
<tr><td>${escapeHtml(p.icon||"⚡")} <b>${escapeHtml(p.name)}</b></td><td>${escapeHtml(p.cat)}</td><td>Rs. ${Number(p.price).toLocaleString()}</td><td><span style="color:#ef4444;font-weight:bold">${escapeHtml(p.discount||"None")}</span></td><td><button class="btn-del" onclick="deleteProduct(${index})">Remove</button></td></tr>`).join(""):`<tr><td colspan="5" style="color:var(--text-dim);text-align:center">No custom products added yet.</td></tr>`;
}

function addProduct(){
const name=document.getElementById("pName").value.trim();
const price=document.getElementById("pPrice").value;
if(!name||!price)return alert("Please fill in Product Name and Sale Price!");

const item={
id:Date.now(),
name,
cat:document.getElementById("pCat").value,
price:Number(price),
oldPrice:Number(document.getElementById("pOldPrice").value)||"",
discount:document.getElementById("pDiscount").value.trim(),
icon:document.getElementById("pIcon").value.trim()||"⚡",
desc:document.getElementById("pDesc").value.trim()||"Premium electronics item.",
rating:"★★★★★ (New)"
};

products.unshift(item);
localStorage.setItem("gondalProducts",JSON.stringify(products));
renderTable();

["pName","pPrice","pOldPrice","pDiscount","pIcon","pDesc"].forEach(id=>document.getElementById(id).value="");
alert("Product published to online store!");
}

function deleteProduct(index){
if(!confirm("Remove this product from the store?"))return;
products.splice(index,1);
localStorage.setItem("gondalProducts",JSON.stringify(products));
renderTable();
}

function saveCms(){
const cms={
title:document.getElementById("cmsTitle").value.trim(),
desc:document.getElementById("cmsDesc").value.trim(),
deal:document.getElementById("cmsDeal").value.trim()
};
localStorage.setItem("gondalCmsData",JSON.stringify(cms));
alert("Website text and floating deal updated!");
}

function loadCms(){
const cms=JSON.parse(localStorage.getItem("gondalCmsData")||"{}");
if(cms.title)document.getElementById("cmsTitle").value=cms.title;
if(cms.desc)document.getElementById("cmsDesc").value=cms.desc;
if(cms.deal)document.getElementById("cmsDeal").value=cms.deal;
}

function showTab(tab,button){
document.getElementById("tabStore").style.display=tab==="tabStore"?"block":"none";
document.getElementById("tabCms").style.display=tab==="tabCms"?"block":"none";
document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
button.classList.add("active");
}

document.getElementById("passCode").addEventListener("keydown",e=>{if(e.key==="Enter")unlockPortal()});
renderTable();
loadCms();
</script>
</body>
</html>
