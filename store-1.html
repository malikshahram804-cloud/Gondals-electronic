<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Electronics Store | Gondal Electronics</title>
<style>
:root{--bg-dark:#06050a;--card-bg:rgba(18,15,30,.85);--accent-purple:#7000ff;--accent-glow:#a855f7;--accent-gold:#f59e0b;--text-white:#f8fafc;--text-dim:#94a3b8;--border:rgba(112,0,255,.25)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg-dark);color:var(--text-white);padding-bottom:80px}
header{position:sticky;top:0;z-index:1000;background:rgba(6,5,10,.94);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.nav-box{max-width:1350px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:18px 24px;gap:15px}
.logo{font-size:22px;font-weight:900;color:#fff;text-decoration:none}.logo span{color:var(--accent-glow)}
.container{max-width:1350px;margin:40px auto 0;padding:0 24px}
.deal-banner{background:linear-gradient(135deg,rgba(112,0,255,.35),rgba(18,15,30,.95));border:1px solid var(--accent-glow);border-radius:24px;padding:28px 36px;margin-bottom:40px;display:flex;align-items:center;justify-content:space-between;gap:20px;box-shadow:0 0 35px rgba(112,0,255,.3)}
.deal-banner h3{font-size:22px;margin-bottom:4px}.deal-banner p{color:var(--text-dim);font-size:15px}
.categories{display:flex;gap:12px;margin-bottom:35px;flex-wrap:wrap}
.cat-btn{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text-dim);padding:12px 24px;border-radius:30px;cursor:pointer;font-size:13px;font-weight:700;transition:.3s}
.cat-btn.active,.cat-btn:hover{background:var(--accent-purple);color:#fff;border-color:var(--accent-glow);box-shadow:0 0 20px rgba(112,0,255,.5)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px}
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:28px;padding:30px;display:flex;flex-direction:column;justify-content:space-between;position:relative;transition:.3s}
.card:hover{border-color:var(--accent-glow);transform:translateY(-6px);box-shadow:0 14px 40px rgba(112,0,255,.25)}
.badge-sale{position:absolute;top:18px;left:18px;background:#ef4444;color:#fff;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:800}
.badge-cat{position:absolute;top:18px;right:18px;background:rgba(112,0,255,.25);border:1px solid var(--accent-glow);color:var(--accent-glow);padding:4px 12px;border-radius:20px;font-size:10px;font-weight:800}
.icon{font-size:64px;text-align:center;margin:24px 0 16px}.price-box{margin-top:10px}.old-price{text-decoration:line-through;color:var(--text-dim);font-size:14px;margin-right:8px}.price{font-size:22px;font-weight:900}.rating{color:var(--accent-gold);font-size:13px;margin-top:6px}
.btn-group{display:flex;gap:10px;margin-top:18px}
.btn-buy-wa,.btn-cart{padding:12px 16px;border-radius:12px;font-weight:800;cursor:pointer;transition:.3s;flex:1;font-size:13px;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-buy-wa{background:#25D366;color:#000;border:0}.btn-buy-wa:hover{background:#1eb855;box-shadow:0 0 15px rgba(37,211,102,.5)}
.btn-cart{background:linear-gradient(135deg,var(--accent-purple),var(--accent-glow));color:#fff;border:0}.btn-cart:hover{box-shadow:0 0 20px rgba(168,85,247,.6)}
.cart-drawer{position:fixed;top:0;right:-450px;width:min(420px,100%);height:100vh;background:#0c0a14;border-left:1px solid var(--border);z-index:2000;padding:35px 28px;transition:.4s ease;display:flex;flex-direction:column;justify-content:space-between}
.cart-drawer.open{right:0}
@media(max-width:700px){.nav-box{padding:14px 16px}.logo{font-size:18px}.deal-banner{padding:22px;flex-direction:column;align-items:flex-start}.grid{grid-template-columns:1fr}.container{padding:0 16px}.nav-box>a:first-child{white-space:nowrap}.main-link{display:none!important}}
</style>
</head>
<body>
<header>
<div class="nav-box">
<a href="store.html" class="logo">GONDAL <span>STORE</span></a>
<div>
<a href="index.html" class="main-link" style="color:var(--text-dim);text-decoration:none;font-size:14px;margin-right:24px">← Main Website</a>
<button class="btn-cart" style="width:auto;display:inline-flex;padding:10px 22px" onclick="toggleCart(true)">🛒 Cart (<span id="cartCount">0</span>)</button>
</div>
</div>
</header>

<div class="container">
<div class="deal-banner">
<div><h3>🔥 Gondal Mega Store Sale Active!</h3><p id="dealText">Special discounted rates, free official doorstep delivery, and extended warranty cards applied today.</p></div>
<span style="background:var(--accent-purple);border:1px solid var(--accent-glow);padding:10px 20px;border-radius:20px;font-weight:800;font-size:12px">ACTIVE SALE</span>
</div>

<div class="categories">
<button class="cat-btn active" onclick="filterCatalog('All',this)">All Items</button>
<button class="cat-btn" onclick="filterCatalog('Inverter AC',this)">Inverter AC</button>
<button class="cat-btn" onclick="filterCatalog('Refrigerators',this)">Refrigerators</button>
<button class="cat-btn" onclick="filterCatalog('Smart TVs',this)">Smart TVs</button>
<button class="cat-btn" onclick="filterCatalog('Washing Machines',this)">Washing Machines</button>
<button class="cat-btn" onclick="filterCatalog('Kitchen',this)">Kitchen</button>
</div>
<div class="grid" id="storeGrid"></div>
</div>

<div class="cart-drawer" id="cartDrawer">
<div>
<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:20px">
<h3 style="font-size:22px">Your Cart</h3>
<button onclick="toggleCart(false)" style="background:none;border:0;color:#fff;font-size:24px;cursor:pointer">✕</button>
</div>
<div id="cartItems" style="margin-top:20px;display:flex;flex-direction:column;gap:14px;max-height:60vh;overflow-y:auto"></div>
</div>
<div style="border-top:1px solid var(--border);padding-top:20px">
<div style="display:flex;justify-content:space-between;margin-bottom:20px;font-size:20px"><span>Total Price:</span><b id="cartTotal" style="color:var(--accent-glow)">Rs. 0</b></div>
<button class="btn-buy-wa" style="width:100%;padding:16px;font-size:15px" onclick="checkoutCartWhatsApp()">Order All Cart Items via WhatsApp</button>
</div>
</div>

<script>
const defaultProducts=[
{id:1,name:"Gondal 1.5 Ton T3 Inverter AC",cat:"Inverter AC",price:154999,oldPrice:175000,discount:"12% OFF",rating:"★★★★★ (48 reviews)",icon:"❄️",desc:"Dual rotary T3 tropical compressor, energy saving, pure copper, 10-year warranty."},
{id:2,name:"Gondal 2.0 Ton Floor Standing Inverter AC",cat:"Inverter AC",price:245000,oldPrice:270000,discount:"10% OFF",rating:"★★★★★ (19 reviews)",icon:"🌬️",desc:"Heavy-duty cooling airflow, 3D air distribution and smart app control."},
{id:3,name:"Side-by-Side Glass Door Refrigerator",cat:"Refrigerators",price:210000,oldPrice:235000,discount:"11% OFF",rating:"★★★★★ (34 reviews)",icon:"🧊",desc:"No-Frost multi-airflow inverter compressor and digital temperature display."},
{id:4,name:"Deep Freezer Double Door 400L",cat:"Refrigerators",price:115000,oldPrice:130000,discount:"11% OFF",rating:"★★★★☆ (22 reviews)",icon:"📦",desc:"Fast freezing capability, cooling retention during power outages and copper evaporator."},
{id:5,name:'65" 4K Ultra HD Smart QLED TV',cat:"Smart TVs",price:165000,oldPrice:190000,discount:"13% OFF",rating:"★★★★★ (56 reviews)",icon:"📺",desc:"Frameless design, HDR10+, Dolby Atmos sound and Android smart platform."},
{id:6,name:'75" Cinema Master 8K Android TV',cat:"Smart TVs",price:340000,oldPrice:380000,discount:"10% OFF",rating:"★★★★★ (12 reviews)",icon:"🖥️",desc:"Quantum-dot 120Hz display, gaming mode and immersive sound."},
{id:7,name:"Fully Automatic Washing Machine 12kg",cat:"Washing Machines",price:98000,oldPrice:110000,discount:"10% OFF",rating:"★★★★★ (41 reviews)",icon:"🧺",desc:"Quiet inverter motor, steam wash, tub clean cycle and smart controls."},
{id:8,name:"Twin Tub Heavy Dryer & Washer 14kg",cat:"Washing Machines",price:48000,oldPrice:55000,discount:"12% OFF",rating:"★★★★☆ (30 reviews)",icon:"🧼",desc:"Rust-resistant body and high-speed spin dryer motor."},
{id:9,name:"Digital Inverter Microwave & Grill 32L",cat:"Kitchen",price:42000,oldPrice:49000,discount:"14% OFF",rating:"★★★★★ (65 reviews)",icon:"🍳",desc:"Convection baking, multiple power levels and automatic cooking presets."},
{id:10,name:"Heavy Duty 5-Burner Cooking Range",cat:"Kitchen",price:85000,oldPrice:98000,discount:"13% OFF",rating:"★★★★★ (28 reviews)",icon:"🔥",desc:"Heavy pan supports, thermostatic gas oven and electric rotisserie."}
];

let products=JSON.parse(localStorage.getItem("gondalProducts"))||defaultProducts;
let cart=[];

function renderStore(filter="All"){
const grid=document.getElementById("storeGrid");
grid.innerHTML="";
const list=filter==="All"?products:products.filter(p=>p.cat===filter);
list.forEach(p=>{
const waText=encodeURIComponent(`Hello Gondal Electronics!\nI would like to purchase:\n\nProduct: ${p.name}\nCategory: ${p.cat}\nPrice: Rs. ${Number(p.price).toLocaleString()}\nDescription: ${p.desc}\n\nPlease confirm availability and delivery details.`);
const waUrl=`https://wa.me/923000000000?text=${waText}`;
grid.innerHTML+=`<div class="card">${p.discount?`<span class="badge-sale">${p.discount}</span>`:""}<span class="badge-cat">${p.cat}</span><div class="icon">${p.icon||"⚡"}</div><div><h3 style="font-size:18px;margin-bottom:6px">${p.name}</h3><p style="color:var(--text-dim);font-size:13px;line-height:1.5">${p.desc}</p><div class="rating">${p.rating||"★★★★★"}</div></div><div style="border-top:1px solid var(--border);padding-top:14px;margin-top:14px"><div class="price-box">${p.oldPrice?`<span class="old-price">Rs. ${Number(p.oldPrice).toLocaleString()}</span>`:""}<span class="price">Rs. ${Number(p.price).toLocaleString()}</span></div><div class="btn-group"><a href="${waUrl}" target="_blank" class="btn-buy-wa">💬 Buy via WhatsApp</a><button class="btn-cart" onclick="addToCart(${p.id})">+ Cart</button></div></div></div>`;
});
}

function filterCatalog(category,button){
document.querySelectorAll(".cat-btn").forEach(b=>b.classList.remove("active"));
button.classList.add("active");
renderStore(category);
}

function addToCart(id){
const item=products.find(p=>p.id===id);
if(item){cart.push(item);updateCart();toggleCart(true);}
}

function toggleCart(open){document.getElementById("cartDrawer").classList.toggle("open",open)}

function updateCart(){
document.getElementById("cartCount").textContent=cart.length;
let total=0;
document.getElementById("cartItems").innerHTML=cart.map((item,i)=>{
total+=Number(item.price);
return `<div style="background:rgba(255,255,255,.04);border:1px solid var(--border);padding:14px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;gap:10px"><div><b>${item.name}</b><br><small style="color:var(--accent-glow)">Rs. ${Number(item.price).toLocaleString()}</small></div><button onclick="cart.splice(${i},1);updateCart()" style="background:none;border:0;color:#ef4444;font-size:18px;cursor:pointer">✕</button></div>`;
}).join("");
document.getElementById("cartTotal").textContent="Rs. "+total.toLocaleString();
}

function checkoutCartWhatsApp(){
if(!cart.length){alert("Your cart is empty!");return}
const details=cart.map((item,i)=>`${i+1}. *${item.name}* - Rs. ${Number(item.price).toLocaleString()}\nSpecs: ${item.desc}`).join("\n\n");
const total=cart.reduce((sum,item)=>sum+Number(item.price),0);
const text=`Hello Gondal Electronics!\nI would like to place an order for:\n\n${details}\n\nTotal Amount: Rs. ${total.toLocaleString()}\n\nPlease confirm availability and payment details.`;
window.open(`https://wa.me/923000000000?text=${encodeURIComponent(text)}`,"_blank");
}

const cms=JSON.parse(localStorage.getItem("gondalCmsData")||"{}");
if(cms.deal)document.getElementById("dealText").textContent=cms.deal;
renderStore();
</script>
</body>
</html>
