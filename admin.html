<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gondal Electronics | Admin Control Panel</title>
<style>
:root {
  --bg-dark: #06050a;
  --card-bg: rgba(18, 15, 30, 0.85);
  --accent-purple: #7000ff;
  --accent-glow: #a855f7;
  --accent-gold: #f59e0b;
  --text-white: #f8fafc;
  --text-dim: #94a3b8;
  --border: rgba(112, 0, 255, 0.25);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-dark); color: var(--text-white); padding: 40px 20px; line-height: 1.6; }

.admin-container { max-width: 800px; margin: 0 auto; background: var(--card-bg); border: 1px solid var(--border); border-radius: 24px; padding: 35px; backdrop-filter: blur(16px); box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
h1 { font-size: 28px; font-weight: 900; margin-bottom: 8px; color: #fff; text-align: center; }
p.sub { color: var(--text-dim); font-size: 14px; text-align: center; margin-bottom: 30px; }

.form-group { margin-bottom: 22px; }
label { display: block; font-size: 13px; font-weight: 700; color: var(--accent-glow); margin-bottom: 8px; letter-spacing: 0.5px; text-transform: uppercase; }
input[type="text"], textarea { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; color: #fff; font-size: 15px; outline: none; transition: 0.3s; }
input[type="text"]:focus, textarea:focus { border-color: var(--accent-glow); box-shadow: 0 0 15px rgba(168,85,247,0.3); }
textarea { resize: vertical; height: 100px; }

.btn-save { width: 100%; background: linear-gradient(135deg, var(--accent-purple), var(--accent-glow)); color: #fff; border: none; padding: 16px; border-radius: 12px; font-weight: 800; font-size: 15px; cursor: pointer; box-shadow: 0 0 25px rgba(112,0,255,0.4); transition: 0.3s; margin-top: 10px; }
.btn-save:hover { opacity: 0.9; transform: translateY(-2px); }

#statusMsg { text-align: center; font-size: 14px; font-weight: 700; margin-top: 18px; display: none; }
.success { color: #10b981; }
.error { color: #ef4444; }
</style>
</head>
<body>

<div class="admin-container">
  <h1>⚡ Admin Control Panel</h1>
  <p class="sub">Manage live homepage title, hero description, and promo banners across your store.</p>

  <form id="cmsForm">
    <div class="form-group">
      <label>Hero Headline / Business Name</label>
      <input type="text" id="heroTitleInput" placeholder="Gondal Electronics" required>
    </div>

    <div class="form-group">
      <label>Hero Description</label>
      <textarea id="heroDescInput" placeholder="Enter updated store banner description..." required></textarea>
    </div>

    <div class="form-group">
      <label>Floating Offer Deal Text</label>
      <input type="text" id="floatingDealInput" placeholder="Get Up to 25% OFF on T3 Inverter ACs..." required>
    </div>

    <button type="submit" class="btn-save">Publish Live Updates to Website</button>
  </form>

  <div id="statusMsg"></div>
</div>

<!-- Firebase Libraries -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
  // Your Live Firebase Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyC7SsDaJhXvEUzhPO94mYcsFyP2Ty0w0R4",
    authDomain: "gondal-electronic.firebaseapp.com",
    projectId: "gondal-electronic",
    storageBucket: "gondal-electronic.firebasestorage.app",
    messagingSenderId: "200158187399",
    appId: "1:200158187399:web:538d8b6b57ae1880708d22"
  };

  // Initialize Firebase & Firestore
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const heroTitleInput = document.getElementById("heroTitleInput");
  const heroDescInput = document.getElementById("heroDescInput");
  const floatingDealInput = document.getElementById("floatingDealInput");
  const statusMsg = document.getElementById("statusMsg");

  // Fetch Current Saved Data from Database
  db.collection("settings").doc("cms").get().then((doc) => {
    if (doc.exists) {
      const data = doc.data();
      if (data.title) heroTitleInput.value = data.title;
      if (data.desc) heroDescInput.value = data.desc;
      if (data.deal) floatingDealInput.value = data.deal;
    }
  });

  // Save New Updates to Firebase Cloud Database
  document.getElementById("cmsForm").addEventListener("submit", (e) => {
    e.preventDefault();

    db.collection("settings").doc("cms").set({
      title: heroTitleInput.value,
      desc: heroDescInput.value,
      deal: floatingDealInput.value,
      updatedAt: new Date().toISOString()
    }, { merge: true })
    .then(() => {
      statusMsg.className = "success";
      statusMsg.textContent = "✅ Updates published live to store!";
      statusMsg.style.display = "block";
      setTimeout(() => { statusMsg.style.display = "none"; }, 4000);
    })
    .catch((error) => {
      statusMsg.className = "error";
      statusMsg.textContent = "❌ Error saving updates: " + error.message;
      statusMsg.style.display = "block";
    });
  });
</script>

</body>
</html>
